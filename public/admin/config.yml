backend:
  name: github
  repo: sIreeram/vaidyovation
  branch: main
  base_url: https://vaidyovation.pages.dev/
  auth_endpoint: api/auth
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: blog
    label: Stories
    label_singular: Story
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Summary, name: description, widget: text }
      - { label: Category, name: category, widget: select, options: ["Medical Innovation","Patient Stories","Research","Technology","Wellness","Dermatology","Editorial"], default: "Medical Innovation" }
      - { label: Cover Image, name: cover, widget: image, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
